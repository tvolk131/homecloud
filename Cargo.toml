[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/core", "crates/store", "crates/host", "crates/client", "crates/daemon", "crates/cli", "crates/guest"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.4"
hex = "0.4"
iroh = "=1.4.1"
nix = { version = "0.30", features = ["sched", "user"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
homecloud-core = { path = "crates/core" }
homecloud-store = { path = "crates/store" }
homecloud-host = { path = "crates/host" }
homecloud-client = { path = "crates/client" }

[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 2
