[package]
name = "homecloud-virtualization"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
proxmox = ["dep:proxmox-client", "dep:http"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
homecloud-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
http = { version = "1", optional = true }
proxmox-client = { git = "https://github.com/proxmox/proxmox-rs.git", rev = "89c1d597a9d15743049eadcb1add380573265904", features = ["hyper-client"], optional = true }

[dev-dependencies]
tempfile.workspace = true
