name: Rust
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: cargo fmt --all -- --check
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}
      - run: cargo test --locked --workspace --exclude homecloud-desktop
      - if: runner.os == 'macOS'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Compare native UI screenshots
        if: runner.os == 'macOS'
        env:
          ICED_TEST_BACKEND: tiny-skia
        run: cargo test --locked -p homecloud-desktop -- --test-threads=1
      - name: Preserve UI screenshots and pixel diffs
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-screenshots
          path: target/ui-screenshots
          if-no-files-found: ignore
      - if: runner.os == 'Linux'
        run: |
          cargo clippy --locked --workspace --exclude homecloud-desktop --all-targets -- -D warnings
          cc -Wall -Wextra -Werror -fsyntax-only crates/host/native/qemu_cpu_launcher.c
      - name: Build the static guest runner
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked --release --target x86_64-unknown-linux-musl -p homecloud-guest
          python3 -c "import sys; sys.path.insert(0, 'scripts'); import host_deploy; assert host_deploy.static_elf(open(sys.argv[1], 'rb').read()), 'guest runner is not static'" target/x86_64-unknown-linux-musl/release/homecloud-guest
      - run: python3 -m py_compile crates/host/host_runtime.py scripts/install_host.py scripts/host_deploy.py scripts/bundle_host.py lab/prove_access.py
      - name: Test guest GitHub authentication and optional tools
        run: |
          python3 -m unittest discover -s crates/host/tests -p test_github_auth.py
          python3 -m unittest discover -s crates/host/tests -p test_providers.py
