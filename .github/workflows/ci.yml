name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace --exclude homecloud-desktop
      - if: runner.os == 'macOS'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Compare native UI screenshots
        if: runner.os == 'macOS'
        env:
          ICED_TEST_BACKEND: tiny-skia
        run: cargo test --locked -p homecloud-desktop -- --test-threads=1
      - name: Preserve UI screenshots and pixel diffs
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-screenshots
          path: target/ui-screenshots
          if-no-files-found: ignore
      - if: runner.os == 'Linux'
        run: |
          cargo clippy --locked --workspace --exclude homecloud-desktop --all-targets -- -D warnings
          cc -Wall -Wextra -Werror -fsyntax-only crates/host/native/qemu_cpu_launcher.c
      - run: python3 -m py_compile crates/host/host_runtime.py scripts/install_host.py scripts/host_deploy.py scripts/bundle_host.py lab/prove_access.py
